<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="coneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEB3B"/>
      <stop offset="100%" stop-color="#FBC02D"/>
    </linearGradient>
  </defs>
  <!-- Background Shield for Safety -->
  <path d="M256 40C150 70 80 160 80 260c0 130 110 200 176 220 66-20 176-90 176-220 0-100-70-190-176-220z" fill="url(#shieldGrad)" stroke="#FFFFFF" stroke-width="8"/>
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="270" r="130" fill="none" stroke="url(#alertGrad)" stroke-width="8" stroke-dasharray="15 10" />

  <!-- Traffic Cone in Center -->
  <path d="M256 160l-70 180h140z" fill="url(#coneGrad)"/>
  <!-- Silver reflective bands on the cone -->
  <path d="M228 230h56l-11 30h-34z" fill="#E0E0E0"/>
  <path d="M211 275h90l-10 25h-70z" fill="#FFFFFF"/>
  <!-- Cone Base -->
  <path d="M160 330h192v25H160z" fill="#37474F" rx="6"/>
  
  <!-- Safety Alert Badge (Siren Pulse) -->
  <circle cx="256" cy="115" r="22" fill="#FF1744" stroke="#FFFFFF" stroke-width="4"/>
  <path d="M256 85v20M225 95l15 15M287 95l-15 15" stroke="#FF1744" stroke-width="4" stroke-linecap="round"/>
</svg>
